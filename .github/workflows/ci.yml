name: CI

on:
  push:
  pull_request:

jobs:
  server-test:
    name: Server tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      # sqlite3는 네이티브 모듈이라 설치 시 프리빌드 바이너리를 받거나(실패 시) 소스에서 빌드한다.
      # ubuntu-latest 러너에는 python3/make/g++가 기본 포함되어 있어 소스 빌드로 폴백돼도 동작한다.
      - name: Install dependencies
        run: npm ci

      - name: Run tests (node:test, DB는 임시 sqlite 파일 사용)
        run: npm test

  # pg 전용 분기(forUpdate, to_char, timestamptz 비교, isProduction 분기)가 지금까지 CI에서
  # 한 줄도 실행되지 않았다 — server-test 잡은 항상 sqlite로만 돈다. 같은 테스트 스위트를
  # Postgres 위에서도 돌려 두 방언 사이에서만 드러나는 버그를 잡는다.
  # `node --test`는 파일을 별도 프로세스로 병렬 실행하는데, pg 잡은 15개 파일이 DATABASE_URL
  # 하나를 공유한다. migrations.test.js가 전체 마이그레이션을 down하는 동안 다른 파일이 그
  # 컬럼에 INSERT하고, stock-transactions.test.js는 stock_ledger를 rename하며, crypto.test.js는
  # 전 매장 시크릿을 암호화한다 — 비결정적으로 깨진다. 파일별 스키마 분리는 initDb()/knexfile까지
  # 손대야 해서, 우선 직렬 실행으로 막는다.
  server-test-postgres:
    name: Server tests (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/app_test
      DATABASE_SSL: disable
      JWT_SECRET: ci-test-secret
      POSMOS_TEST_PG: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests (Postgres, 파일 간 DB 공유라 직렬 실행)
        run: npm run test:serial

  client-build:
    name: Client build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (빌드가 깨지는지만 확인)
        run: npm run build
